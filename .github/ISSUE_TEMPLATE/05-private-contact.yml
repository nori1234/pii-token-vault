name: 非公開で連絡したい
description: 脆弱性などを非公開で伝えたいとき。ここには詳細を書かない
title: "[連絡の依頼] "
body:
  - type: markdown
    attributes:
      value: |
        **詳細は書かないでください。** まず SECURITY.md の方法（Security タブの「Report a vulnerability」、またはメール）を試してください。
        どちらも使えないときだけ、このイシューを送ってください。メンテナーから連絡します。
  - type: checkboxes
    id: no-details
    attributes:
      label: 確認
      options:
        - label: このイシューに、脆弱性の内容や再現の手順を書いていない
          required: true
