# CI：PR と main への push で、lint・typecheck・test・e2e を実行する（CLAUDE.md「コマンド」、plan 11章）。
#
# - pull_request_target は使わない。フォークからの PR は、読み取りだけのトークンで、秘密の値なしに動く。
# - アクションは、コミットの SHA で固定する（末尾のコメントは、その SHA の版）。
# - テストは root では動かさない。scripts/pg-up.ts は、ランナーの利用者のまま initdb と pg_ctl を実行する。
#   sudo を使うのは、PostgreSQL 16 と Chromium の依存を入れる手順だけ。
# - npm ci には --ignore-scripts を付ける。依存のインストールスクリプトを動かさない
#   （package-lock.json で、インストールスクリプトを持つのは macOS 専用の fsevents だけ）。

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR では、新しい push が来たら古い実行を止める。main への push は止めずに順に流す。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint・typecheck・test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: シンボリックリンクを追跡していないことを確かめる
        # 追跡したリンクは、checkout でリンク先を指すようになり、npm ci などがリンク先の中身を消しうる。
        # そのため、check と e2e のどちらのジョブでも、依存を入れる前（checkout の直後）に確かめる。
        run: |
          links=$(git ls-files -s | awk '$1 == "120000"' | cut -f2)
          if [ -n "$links" ]; then
            echo "$links"
            echo '::error::シンボリックリンクを追跡しない'
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: lint（Biome）
        run: npm run lint

      - name: lint をすり抜ける書き方がないことを確かめる
        # 次のものは、不変条件7と9の lint を黙って外せるが、Biome の設定では禁止できない。
        # - biome-ignore の抑止のコメント
        # - process.getBuiltinModule（import を書かずに node:net や node:crypto を読み込める）
        # - 入れ子の biome.json（ルートの設定を上書きできる）
        run: |
          if git grep -nE 'biome-ignore|getBuiltinModule' -- packages spikes ':(exclude)*.md'; then
            echo '::error::biome-ignore と process.getBuiltinModule は使わない（不変条件7と9）'
            exit 1
          fi
          nested=$(git ls-files | grep -E '(^|/)\.?biome\.jsonc?$' | grep -vx 'biome.json' || true)
          if [ -n "$nested" ]; then
            echo "$nested"
            echo '::error::Biome の設定は、ルートの biome.json だけにする（不変条件7と9）'
            exit 1
          fi

      - name: 本体のコードから、lint の制限を外したファイルを import していないことを確かめる
        # テスト、scripts/、test/、ルートの *.config.ts は、lint の制限を外している（biome.json の overrides）。
        # 本体のコードがそれらを import すると、制限した import を、lint に止められずに使える。
        # Node が実際に読み込むのと同じ方法（型の除去と import.meta.resolve）でたどった import のグラフで確かめる
        # （副作用だけの import、改行をはさむ import、export … from、package.json の exports と imports、
        # クエリや %XX を付けた読み込み先、間接の import を含む）。たどれない読み込み方として、引用符で囲んだ
        # 文字列リテラル1つ以外を渡す動的な import（括弧の中の型の構文を含む）、ファイルと node: の組み込み以外を
        # 読み込む import、解決できない import、CommonJS のファイルも拒否する。
        run: node scripts/check-entry-imports.ts

      - name: typecheck（tsc --noEmit）
        run: npm run typecheck

      - name: PostgreSQL 16 のバイナリを確かめる
        # ubuntu-24.04 のイメージには、ふつう PostgreSQL 16 が入っている（サービスは止まったまま）。
        # 無いときだけ apt で入れる。システムのクラスタは作らず、サービスも起動しない。
        run: |
          if [ ! -x "$PG_BIN/initdb" ]; then
            sudo install -d /etc/postgresql-common/createcluster.d
            echo 'create_main_cluster = false' \
              | sudo tee /etc/postgresql-common/createcluster.d/ci-no-main-cluster.conf > /dev/null
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 0755 /usr/sbin/policy-rc.d
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends postgresql-16
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          "$PG_BIN/initdb" --version

      - name: test（Vitest。一時的な Postgres を起動して止める）
        run: npm test

  e2e:
    name: e2e（Playwright）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # E2E（test/leak/x-idp-browser.e2e.ts）は、一時的な Postgres と鍵サービスと idp を、テストのワーカーの中で起動する（M3）。
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: シンボリックリンクを追跡していないことを確かめる
        # 追跡したリンクは、checkout でリンク先を指すようになり、npm ci などがリンク先の中身を消しうる。
        # そのため、check と e2e のどちらのジョブでも、依存を入れる前（checkout の直後）に確かめる。
        run: |
          links=$(git ls-files -s | awk '$1 == "120000"' | cut -f2)
          if [ -n "$links" ]; then
            echo "$links"
            echo '::error::シンボリックリンクを追跡しない'
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Chromium を入れる
        # @playwright/test は 1.56.1 に固定している。ブラウザはその版に合うものが入る。
        # --no：node_modules にある版だけを使い、見つからなければ、ネットから別の版を取らずに失敗する。
        run: npx --no playwright install --with-deps chromium

      - name: PostgreSQL 16 のバイナリを確かめる
        # ubuntu-24.04 のイメージには、ふつう PostgreSQL 16 が入っている（サービスは止まったまま）。
        # 無いときだけ apt で入れる。システムのクラスタは作らず、サービスも起動しない。
        run: |
          if [ ! -x "$PG_BIN/initdb" ]; then
            sudo install -d /etc/postgresql-common/createcluster.d
            echo 'create_main_cluster = false' \
              | sudo tee /etc/postgresql-common/createcluster.d/ci-no-main-cluster.conf > /dev/null
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 0755 /usr/sbin/policy-rc.d
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends postgresql-16
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          "$PG_BIN/initdb" --version

      - name: e2e（CDP の仮想認証器）
        run: npm run e2e

      - name: 失敗したときだけ、レポートを残す
        if: ${{ failure() }}
        # トレースは playwright.config.ts で off にしている。テストの値は乱数で、本物の連絡先は入らない。
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: ignore
