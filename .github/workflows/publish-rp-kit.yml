# rp-kit を npm に公開する（ADR 0031、packages/rp-kit/README.md の「メンテナー向け」）。
#
# - メンテナーが、Actions の画面から、main で手で起動する（workflow_dispatch）。既定は dry_run（公開しない）。
# - 公開するのは、そのコミットで CI（lint・typecheck・test と e2e）が通ったものだけ。
# - まとめるジョブ（pack）と、公開するジョブ（publish）を分ける。
#   - pack は、npm ci（--ignore-scripts）と npm run pack:rp-kit で tarball を作る。秘密の値を持たない。
#     作った tarball を空のプロジェクトに入れ、パッケージ名で読み込めることと、企業に届く依存（dependencies）に
#     既知の脆弱性がないこと（npm audit --omit=dev）を確かめる。CI の npm ci は --no-audit なので、ここで確かめる。
#   - publish は、pack が作った tarball を受け取って、npm stage publish だけを実行する（staged publishing）。
#     依存を入れず、リポジトリのコードも動かさない。environment「npm-publish」の保護の規則で、main だけと、
#     メンテナーの承認を求める。
# - npm には、trusted publishing（GitHub Actions の OIDC）でつなぐ。npm のトークンは使わない。npm の側では、
#   このワークフロー（publish-rp-kit.yml）と environment（npm-publish）からの npm stage publish だけを許し、
#   npm publish と npm dist-tag は許さない（ADR 0031 の追記）。
# - 仮置きした版は、まだ誰も入れられない。npm にログインしたメンテナーが、2段階認証をして
#   npm stage approve <stage-id> を実行したときに公開される。
# - provenance を付ける（npm のページで、どのコミットとワークフローから作ったかを確かめられる）。
# - 公開のワークフローでは、依存のキャッシュを使わない。
# - アクションは、コミットの SHA で固定する（末尾のコメントは、その SHA の版）。

name: rp-kit を npm に公開

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 公開しない（中身と版を確かめるだけ）。公開するときは外す
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-rp-kit
  cancel-in-progress: false

jobs:
  pack:
    name: まとめる
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: このコミットで CI が通ったことを確かめる
        # check run は、同じ名前のものが再実行で増えても、API の既定（filter=latest）で最後のものだけが返る。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[]
                   | select(.app.slug == "github-actions" and .conclusion == "success")
                   | select(.name == "lint・typecheck・test" or .name == "e2e（Playwright）")
                   | .name] | unique | length')
          if [ "$passed" != "2" ]; then
            echo '::error::このコミットで CI（lint・typecheck・test と e2e）が通っていない。CI が終わってから起動する'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: シンボリックリンクを追跡していないことを確かめる
        # ci.yml と同じ。依存を入れる前に確かめる。
        run: |
          links=$(git ls-files -s | awk '$1 == "120000"' | cut -f2)
          if [ -n "$links" ]; then
            echo "$links"
            echo '::error::シンボリックリンクを追跡しない'
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 依存を入れる
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: まとめる（pack:rp-kit と npm pack）
        id: pack
        run: |
          out="$RUNNER_TEMP/rp-kit-publish"
          dist="$RUNNER_TEMP/dist"
          npm run pack:rp-kit -- "$out"
          mkdir -p "$dist"
          cd "$out"
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if [ "$name" != "@pii-token-vault/rp-kit" ]; then
            echo "::error::パッケージ名が違う（${name}）"
            exit 1
          fi
          # 同じ版は二度と公開できない。公開済みなら、ここで止める。npm view は、パッケージか版が無いときだけ
          # E404 で終わる。それ以外の失敗（レジストリの障害など）では、公開済みかどうか分からないので止める。
          view_err="$RUNNER_TEMP/npm-view.err"
          if npm view "${name}@${version}" version 2>"$view_err"; then
            echo "::error::${name}@${version} は公開済み。packages/rp-kit/package.json の version を上げる"
            exit 1
          elif ! grep -q 'code E404' "$view_err"; then
            cat "$view_err"
            echo "::error::${name}@${version} が公開済みかを、npm のレジストリで確かめられなかった"
            exit 1
          fi
          tarball=$(npm pack --ignore-scripts --json --pack-destination "$dist" | jq -r '.[0].filename')
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "${name}@${version}（${tarball}）をまとめた。" >> "$GITHUB_STEP_SUMMARY"

      - name: 中身を確かめる（dry-run。公開しない）
        working-directory: ${{ runner.temp }}/dist
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish --dry-run --ignore-scripts "./${TARBALL}"

      - name: 空のプロジェクトに入れて確かめる（パッケージ名での読み込みと、依存の監査）
        # 企業が npm install したときと同じ形で、SDK と /kit を読み込めることを確かめる。そのうえで、企業に届く
        # 依存だけを対象に、既知の脆弱性を調べる（重さによらず、1件でもあれば止める）。
        working-directory: ${{ runner.temp }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          mkdir consumer
          cd consumer
          echo '{"name":"rp-kit-consumer-check","private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/dist/${TARBALL}"
          node --input-type=module -e "
            const sdk = await import('@pii-token-vault/rp-kit');
            const kit = await import('@pii-token-vault/rp-kit/kit');
            if (Object.keys(sdk).length === 0 || Object.keys(kit).length === 0) process.exit(1);
          "
          npm ls --omit=dev --all
          npm audit --omit=dev --audit-level=low

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rp-kit-tarball
          path: ${{ runner.temp }}/dist/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: npm に仮置きする
    needs: pack
    if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rp-kit-tarball
          path: dist

      # registry-url は渡さない。渡すと、トークンを読む .npmrc を作るため。npm の既定のレジストリ
      # （registry.npmjs.org）に、trusted publishing（OIDC）でつなぐ。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: npm を、staged publishing に対応した版にする
        # npm stage は、Node 22 に付いてくる npm（10.x）にはない。版はぴったり固定する。
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@12.2.3
          if [ "$(npm --version)" != "12.2.3" ]; then
            echo "::error::npm の版が 12.2.3 ではない（$(npm --version)）"
            exit 1
          fi

      - name: 仮置きする（trusted publishing。provenance 付き。まだ公開しない）
        # trusted publishing の接続が npm の登録と合わないと、トークンを得られずに、ここで止まる（何も出ない）。
        working-directory: dist
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/npm-stage.out"
          if ! npm stage publish --provenance --access public --ignore-scripts "./${TARBALL}" | tee "$out"; then
            # npm は、trusted publishing のトークンを得られなかった理由を、画面には出さず、ログのファイル
            # （~/.npm/_logs）にだけ書く。その OIDC の行だけを出す（トークンの値は書かれない）。
            echo '::group::npm の OIDC の記録（trusted publishing のトークンを得られなかった理由）'
            grep -h -E ' oidc ' "$HOME"/.npm/_logs/*-debug-0.log || echo '（OIDC の記録はない）'
            echo '::endgroup::'
            echo '::error::npm に仮置きできなかった。npm の trusted publishing の登録（nori1234/pii-token-vault、publish-rp-kit.yml、environment npm-publish）を確かめる'
            exit 1
          fi
          staged=$(grep -E '^\+ .*\(staged' "$out" || true)
          {
            echo "${TARBALL} を npm に仮置きした。まだ公開していない（誰も入れられない）。"
            echo
            echo "\`${staged}\`"
            echo
            echo '公開するには、npm にログインしたメンテナーが、2段階認証をして `npm stage approve <stage-id>` を実行する。'
            echo '取りやめるときは `npm stage reject <stage-id>`。手順は packages/rp-kit/README.md の「メンテナー向け」。'
          } >> "$GITHUB_STEP_SUMMARY"
